apiVersion: v1
kind: ConfigMap
metadata:
  name: product-svc-config
  namespace: microservices
data:
  MONGO_URI: "mongodb://product-db-svc:27017/products"
  PORT: "3002"
  VENDOR_SERVICE_URL: "http://vendor-svc:3001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-svc
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-svc
  template:
    metadata:
      labels:
        app: product-svc
    spec:
      containers:
      - name: product-svc
        image: product-svc:latest
        ports:
        - containerPort: 3002
        envFrom:
        - configMapRef:
            name: product-svc-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: product-svc
  namespace: microservices
spec:
  selector:
    app: product-svc
  ports:
  - port: 3002
    targetPort: 3002
  type: ClusterIP
