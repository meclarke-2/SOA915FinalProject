apiVersion: v1
kind: Service
metadata:
  name: vendor-svc-lb
  namespace: microservices
spec:
  selector:
    app: vendor-svc
  ports:
  - port: 80
    targetPort: 3001
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: product-svc-lb
  namespace: microservices
spec:
  selector:
    app: product-svc
  ports:
  - port: 80
    targetPort: 3002
  type: LoadBalancer
