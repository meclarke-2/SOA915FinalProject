apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vendor-db-pvc
  namespace: microservices
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-db-pvc
  namespace: microservices
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendor-db
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vendor-db
  template:
    metadata:
      labels:
        app: vendor-db
    spec:
      containers:
      - name: vendor-db
        image: mongo:7
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: vendor-db-storage
          mountPath: /data/db
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: vendor-db-svc
  namespace: microservices
spec:
  selector:
    app: vendor-db
  ports:
  - port: 27017
    targetPort: 27017
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-db
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-db
  template:
    metadata:
      labels:
        app: product-db
    spec:
      containers:
      - name: product-db
        image: mongo:7
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: product-db-storage
          mountPath: /data/db
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: product-db-svc
  namespace: microservices
spec:
  selector:
    app: product-db
  ports:
  - port: 27017
    targetPort: 27017
  clusterIP: None
