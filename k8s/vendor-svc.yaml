apiVersion: v1
kind: Namespace
metadata:
  name: microservices
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vendor-svc-config
  namespace: microservices
data:
  MONGO_URI: "mongodb://vendor-db-svc:27017/vendors"
  PORT: "3001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendor-svc
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vendor-svc
  template:
    metadata:
      labels:
        app: vendor-svc
    spec:
      containers:
      - name: vendor-svc
        image: vendor-svc:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: vendor-svc-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vendor-svc
  namespace: microservices
spec:
  selector:
    app: vendor-svc
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP
