name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies (vendor)
      run: |
        cd vendor-svc
        npm install

    - name: Install dependencies (product)
      run: |
        cd product-svc
        npm install

    - name: Lint code (vendor)
      run: |
        cd vendor-svc
        npm run lint || true

    - name: Lint code (product)
      run: |
        cd product-svc
        npm run lint || true

  docker-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build vendor-svc Docker image
      run: docker build ./vendor-svc -t vendor-svc:test || true

    - name: Build product-svc Docker image
      run: docker build ./product-svc -t product-svc:test || true
